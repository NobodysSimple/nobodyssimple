<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Staff login · Nobody’s Simple</title>
    <link rel="icon" href="logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="index.html"
        ><img src="logo.png" alt="" /><span>Nobody’s Simple</span></a
      ><a href="index.html">×</a>
    </header>
    <main class="wrap staff-page">
      <section id="login" class="staff-login">
        <p class="eyebrow">Nobody’s Simple</p>
        <h1>Staff login</h1>
        <form id="login-form">
          <input
            id="token"
            type="password"
            autocomplete="current-password"
            aria-label="Password"
            placeholder="Password"
            required
          /><button class="button full" id="connect" type="submit">
            Continue
          </button>
          <p id="login-status" role="status"></p>
        </form>
      </section>
      <section id="studio" hidden>
        <div class="row spaced">
          <p class="badge">Connected</p>
          <button class="chip" id="disconnect">×</button>
        </div>
        <div class="studio-layout">
          <aside class="studio-sidebar">
            <button class="button secondary" data-template="blog">
              + Blog post</button
            ><button class="button secondary" data-template="education">
              + Educational writing</button
            ><button class="button secondary" data-template="video">
              + YouTube video</button
            ><button class="chip" id="load-draft">Load draft</button
            ><label class="field"
              >Restore draft<input
                id="import-draft"
                type="file"
                accept="application/json,.json" /></label
            ><button class="chip" id="clear-draft">Clear saved draft</button>
            <div id="existing"></div>
          </aside>
          <div>
            <form id="editor" class="studio-form">
              <p class="eyebrow" id="template-label">Blog post</p>
              <label class="field"
                >Title<input name="title" required maxlength="200" /></label
              ><label class="field"
                >Short introduction<textarea
                  name="excerpt"
                  rows="2"
                ></textarea></label
              ><label class="field" id="youtube-field" hidden
                >YouTube video<input name="youtube" type="url"
              /></label>
              <div class="two">
                <label class="field"
                  >Thumbnail<input
                    id="thumbnail-file"
                    type="file"
                    accept="image/png,image/jpeg,image/webp" /></label
                ><label class="field"
                  >Image description<input name="thumbnailAlt"
                /></label>
              </div>
              <div>
                <img
                  id="thumbnail-preview"
                  class="gallery-thumb"
                  alt="Thumbnail preview"
                  hidden
                /><button class="chip" id="remove-thumbnail" type="button">
                  Remove thumbnail
                </button>
              </div>
              <label class="field"
                >Writing / video notes<textarea
                  name="body"
                  rows="14"
                ></textarea>
              </label>
              <div class="two">
                <label class="field"
                  >Add image<input
                    id="inline-file"
                    type="file"
                    accept="image/png,image/jpeg,image/webp" /></label
                ><label class="field"
                  >Image description<input id="inline-alt"
                /></label>
              </div>
              <label class="field"
                >Topics<input
                  name="topics"
                  placeholder="Separate themes with commas"
              /></label>
              <div id="curriculum-fields" hidden>
                <div class="two">
                  <div>
                    <p class="eyebrow">Modules</p>
                    <div class="checks" id="module-checks"></div>
                  </div>
                  <div>
                    <p class="eyebrow">Lessons</p>
                    <div class="checks" id="week-checks"></div>
                  </div>
                </div>
              </div>
              <p class="notice" id="destination-note"></p>
              <div class="row">
                <button class="button secondary" id="preview" type="button">
                  Preview</button
                ><button class="chip" id="save-draft" type="button">
                  Save draft</button
                ><button class="chip" id="download-draft" type="button">
                  Download backup
                </button>
              </div>
              <div class="row">
                <button class="button" id="publish" type="submit">
                  Publish</button
                ><button
                  class="button secondary"
                  id="unpublish"
                  type="button"
                  hidden
                >
                  Unpublish
                </button>
              </div>
              <p id="publish-status" role="status" class="status"></p>
            </form>
            <div id="preview-area" class="preview article-body" hidden></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="studio.mjs"></script>
  </body>
</html>

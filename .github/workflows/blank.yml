name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: JavaScript checks and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and offline assets
        run: npm run check
      - name: Run JavaScript unit and regression tests
        run: npm test
      - name: Self-test synthetic corpus audit and reviewer-pack generator
        run: python3 scripts/hypothesis-stage5-source-audit.py --self-test

  browser:
    name: Mobile, desktop and automated accessibility smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser, mobile and accessibility checks
        run: npm run test:browser

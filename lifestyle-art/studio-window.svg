<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 390" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Decorative sunny studio window opening onto a green countryside, with books, a desk lamp and a steaming cup">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff9ee"/><stop offset=".45" stop-color="#f9eedb"/><stop offset="1" stop-color="#e4d5bb"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b6d7e3"/><stop offset=".6" stop-color="#e2eae0"/><stop offset="1" stop-color="#f7e6bf"/></linearGradient>
 <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#90b1b6"/><stop offset="1" stop-color="#b2c5a1"/></linearGradient>
 <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bacc92"/><stop offset=".6" stop-color="#8fae82"/><stop offset="1" stop-color="#628b6c"/></linearGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ad8060"/><stop offset=".28" stop-color="#936f55"/><stop offset="1" stop-color="#735541"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff0c3" stop-opacity=".76"/><stop offset="1" stop-color="#fff0c3" stop-opacity="0"/></radialGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="3" seed="16" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="2.4"/></filter>
 <clipPath id="window"><rect x="805" y="0" width="675" height="306" rx="2"/></clipPath>
</defs>
